<!doctype html>
<meta charset="utf-8" />

<head>
    <title data-i18n="desktop.menu.about">About Larpcord</title>

    <link rel="stylesheet" href="./common.css" type="text/css" />

    <script>
        // Larpcord: Das About-Fenster hat keinen Preload. Die Übersetzungen (desktop.*) kommen deshalb
        // als JSON im Query-Parameter I18N (siehe src/main/about.ts) und werden hier für i18n.js bereitgestellt.
        (() => {
            let strings = null;
            try {
                strings = JSON.parse(new URLSearchParams(location.search).get("I18N") || "null");
            } catch (e) {
                console.error("[Larpcord] Übersetzungen konnten nicht gelesen werden", e);
            }
            window.LarpcordViewI18n = { get: () => strings, onChange() {} };
        })();
    </script>
    <script src="./i18n.js"></script>

    <style>
        body {
            padding: 2em;
        }

        h1 {
            text-align: center;
        }

        ul {
            display: flex;
            flex-direction: column;
            gap: 0.5em;
        }
    </style>
</head>

<body>
    <h1 id="title">🎭 Larpcord v{{APP_VERSION}}</h1>
    <p data-i18n="desktop.about.intro"></p>
    <!-- data-i18n-links: Text mit {platzhaltern}, die durch die Kind-Elemente mit passendem data-slot ersetzt werden -->
    <p data-i18n-links="desktop.about.basedOn">
        <a data-slot="vesktop" href="https://github.com/Vencord/Vesktop" target="_blank">Vesktop</a>
        <a data-slot="vencord" href="https://github.com/Vendicated/Vencord" target="_blank">Vencord</a>
    </p>

    <section>
        <h2 data-i18n="desktop.about.links"></h2>
        <ul>
            <li>
                <a href="https://github.com/Vencord/Vesktop" target="_blank" data-i18n="desktop.about.sourceCode"
                    data-i18n-vars='{"name":"Vesktop"}'></a>
            </li>
            <li>
                <a href="https://github.com/Vendicated/Vencord" target="_blank" data-i18n="desktop.about.sourceCode"
                    data-i18n-vars='{"name":"Vencord"}'></a>
            </li>
        </ul>
    </section>

    <section>
        <h2 data-i18n="desktop.about.license"></h2>
        <p>
            <span data-i18n-links="desktop.about.licenseText">
                <a data-slot="license" href="https://www.gnu.org/licenses/gpl-3.0.txt" target="_blank">GNU General Public License v3.0</a>
            </span>
            <br />
            <span data-i18n="desktop.about.freeSoftware"></span>
        </p>
    </section>

    <section>
        <h2 data-i18n="desktop.about.acknowledgements"></h2>
        <p data-i18n="desktop.about.poweredBy"></p>
        <ul>
            <li>
                <a href="https://github.com/electron/electron" target="_blank">Electron</a>
                - <span data-i18n="desktop.about.electron"></span>
            </li>
            <li>
                <a href="https://github.com/electron-userland/electron-builder" target="_blank">Electron Builder</a>
                - <span data-i18n="desktop.about.electronBuilder"></span>
            </li>
            <li>
                <a href="https://github.com/OpenAsar/arrpc" target="_blank">arrpc</a>
                - <span data-i18n="desktop.about.arrpc"></span>
            </li>
            <li>
                <a href="https://github.com/Soundux/rohrkabel" target="_blank">rohrkabel</a>
                - <span data-i18n="desktop.about.rohrkabel"></span>
            </li>
            <li data-i18n-links="desktop.about.moreLibraries">
                <a data-slot="more" href="https://github.com/Vencord/Vesktop/blob/main/pnpm-lock.yaml" target="_blank"
                    data-i18n="desktop.about.moreLibrariesLink"></a>
            </li>
        </ul>
    </section>
</body>

<script>
    const data = new URLSearchParams(location.search);

    // replace all {{FOO}} placeholders in the document with the values from the URL

    /** @param {Node} [node] */
    function walk(node) {
        if (node.nodeType === Node.TEXT_NODE) {
            node.textContent = node.textContent.replace(/{{(\w+)}}/g, (match, key) => data.get(key) || match);
            return;
        }

        if (node.nodeType === Node.ELEMENT_NODE && node.nodeName !== "SCRIPT") {
            for (const child of node.childNodes) {
                walk(child);
            }
        }
    }

    walk(document.body);

    // Larpcord: Texte mit eingebetteten Links. Die Links bleiben dieselben Elemente, nur der Text drumherum
    // kommt aus der Übersetzung ("… {vesktop} und {vencord} …").
    const slots = new Map();
    function fillLinks() {
        for (const el of document.querySelectorAll("[data-i18n-links]")) {
            if (!slots.has(el)) {
                slots.set(el, Object.fromEntries([...el.querySelectorAll("[data-slot]")].map(s => [s.dataset.slot, s])));
            }
            const elements = slots.get(el);
            const parts = LarpcordI18n.t(el.dataset.i18nLinks).split(/\{(\w+)\}/);
            el.replaceChildren(...parts.map((part, i) => (i % 2 === 0 ? part : elements[part] ?? `{${part}}`)));
        }
    }

    fillLinks();
    LarpcordI18n.onChange(fillLinks);
</script>
