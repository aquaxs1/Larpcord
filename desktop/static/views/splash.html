<!doctype html>
<meta charset="utf-8" />

<head>
    <script>
        // Larpcord: muss vor dem Stylesheet laufen, sonst blitzt kurz der helle Hintergrund auf.
        // ?setup=1 = allererster Start, ?reducedMotion=1 = Discords „Reduzierte Bewegung“ der letzten Sitzung.
        (() => {
            const params = new URLSearchParams(location.search);
            if (params.get("setup") === "1") document.documentElement.classList.add("setup");
            if (params.get("reducedMotion") === "1") document.documentElement.classList.add("reduced-motion");
        })();
    </script>

    <link rel="stylesheet" href="./common.css" type="text/css" />
    <!-- Larpcord: Übersetzungen (data-i18n), braucht exposeViewI18n() im Splash-Preload -->
    <script src="./i18n.js"></script>

    <style>
        /* Erster Start: Discord-Look, egal wie das System eingestellt ist. Es gibt ja noch keine
           Theme-Farben aus Discord; sind welche da, gewinnen sie (splash.ts setzt sie mit !important). */
        html.setup {
            color-scheme: dark;
            --bg: #1e1f22;
            --fg: #f2f3f5;
            --fg-secondary: #b5bac1;
            --fg-semi-trans: rgb(255 255 255 / 0.2);
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: none;
            user-select: none;
            -webkit-app-region: drag;
            overflow: hidden;
        }

        .wrapper {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            border: 1px solid var(--fg-semi-trans);
            background: var(--bg);
        }

        .message {
            top: 70%;
            word-break: break-word;
            padding: 0 16px;
            position: absolute;
            font-size: 14px
        }

        p {
            text-align: center;
        }

        img {
            width: 128px;
            height: 128px;
            object-fit: contain;
            /* Larpcord: sanftes Schweben/Pulsieren des Logos */
            animation: larp-float 2.6s ease-in-out infinite;
        }

        @keyframes larp-float {

            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            50% {
                transform: translateY(-6px) scale(1.04);
                opacity: 0.85;
            }
        }

        /* Reduzierte Bewegung: System-Einstellung und Discords eigene (?reducedMotion=1) */
        @media (prefers-reduced-motion: reduce) {
            img {
                animation: none;
            }
        }

        html.reduced-motion img {
            animation: none;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <img draggable="false" src="vesktop://assets/splash" alt="" role="presentation" />
        <p id="splash-text" data-i18n="desktop.splash.loading">Loading Larpcord...</p>
        <p class="message"></p>
    </div>
</body>

<script>
    // Larpcord: beim allerersten Start (html.setup, siehe Skript im <head>) „Larpcord wird eingerichtet …“
    // statt des Ladetexts. i18n-keys: desktop.splash.setup
    (() => {
        if (!document.documentElement.classList.contains("setup")) return;
        const el = document.getElementById("splash-text");
        el.dataset.i18n = "desktop.splash.setup";
        window.LarpcordI18n?.apply();
    })();

    document.addEventListener("DOMContentLoaded", () => {
        const messageElement = document.querySelector('.message');
        VesktopSplashNative.onUpdateMessage(message => {
            messageElement.textContent = message;
        })
    });
</script>
