# Baut bei jedem Tag "v*" die Windows-.exe und veröffentlicht sie als GitHub-Release inklusive
# latest.yml und .blockmap, damit der Auto-Updater (electron-updater) neue Versionen findet.
# Tags mit "-beta" (z. B. v0.3.0-beta.1) werden als Prerelease veröffentlicht und nur vom Kanal „Beta“ installiert.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Übersetzungen prüfen
        run: node scripts/i18n/check.mjs

      # postinstall installiert core/ und desktop/ (inkl. Electron-Binary)
      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Version aus dem Tag übernehmen
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      # Abschnitt aus CHANGELOG.md → Release-Text → Changelog im Update-Hinweis
      - name: Release-Notes aus CHANGELOG.md
        run: node scripts/release-notes.mjs ${{ github.ref_name }}

      - name: Core und Desktop bauen
        run: node scripts/build.mjs
        env:
          VENCORD_HASH: ${{ github.sha }}
          VENCORD_REMOTE: ${{ github.repository }}

      # Bewusst ohne "--publish always": electron-builder lädt dabei nebenher hoch, der Schritt kann
      # enden, bevor die große .exe und latest.yml oben sind (genau das ist bei v0.2.0 passiert).
      # Die Update-Datei latest.yml entsteht auch mit "--publish never", weil publish in
      # desktop/package.json konfiguriert ist.
      - name: Paketieren
        run: pnpm -C desktop exec electron-builder --win --publish never

      - name: Veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(
            desktop/dist/Larpcord-Setup.exe
            desktop/dist/Larpcord-Setup.exe.blockmap
            desktop/dist/latest.yml
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::Datei fehlt nach dem Paketieren: $f"; exit 1; }
          done

          prerelease=()
          case "$TAG" in *-beta*) prerelease=(--prerelease);; esac

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --title "${TAG#v}" \
              --notes-file desktop/release-notes.md "${prerelease[@]}" "${files[@]}"
          fi

          # Ein abgebrochener Lauf kann einen Entwurf hinterlassen haben – der wäre für niemanden
          # sichtbar und der Auto-Updater fände ihn nicht.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi

          # Erst wenn alle drei Dateien wirklich am Release hängen, gilt der Schritt als erfolgreich
          uploaded="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            grep -qx "$name" <<< "$uploaded" || { echo "::error::Nicht hochgeladen: $name"; exit 1; }
          done
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false" ] \
            || { echo "::error::Release ist noch ein Entwurf"; exit 1; }
          echo "Veröffentlicht: $uploaded"
