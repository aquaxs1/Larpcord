# Schnelle Prüfungen bei jedem Push und Pull Request (ohne Build).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Braucht keine Abhängigkeiten: prüft Sprachdateien und Schlüssel im Code
      - name: Übersetzungen prüfen
        run: node scripts/i18n/check.mjs
