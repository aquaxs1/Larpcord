<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Larpcord</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
            background: #1e1f22; color: #dbdee1; font: 16px/1.5 system-ui, -apple-system, sans-serif;
            padding: 24px; box-sizing: border-box;
        }
        h1 { font-size: 1.4rem; margin: 0 0 8px; }
        p { margin: 0 0 20px; color: #b5bac1; }
        a { display: inline-block; padding: 12px 22px; border-radius: 8px; background: #d4a72c; color: #1e1f22; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>Discord is not reachable</h1>
        <p>Larpcord needs an internet connection. Check it and try again.</p>
        <a href="https://discord.com/app">Try again</a>
    </main>
</body>
</html>
